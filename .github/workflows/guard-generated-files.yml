name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # release-please owns CHANGELOG.md and .release-please-manifest.json; only its
    # same-repository PR is exempt because that is where those files change.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]' &&
      (github.event.pull_request.user.type != 'Bot' || !startsWith(github.event.pull_request.head.ref, 'release-please--') || github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      - name: Check PR does not modify release-please-generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # --no-renames reports a rename as a delete plus an add, so moving a
          # protected file away still counts as touching it.
          files=$(git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}")

          violated=""
          for path in CHANGELOG.md .release-please-manifest.json; do
            if printf '%s\n' "$files" | grep -qxF -- "$path"; then
              # Creating the manifest is the one-time release-please bootstrap;
              # once it exists on the base, only release-please edits it.
              if [ "$path" = .release-please-manifest.json ] &&
                ! git cat-file -e "${BASE_SHA}:${path}" 2>/dev/null; then
                continue
              fi
              violated="${violated} ${path}"
            fi
          done

          if [ -n "$violated" ]; then
            {
              echo "::error::This PR modifies release-please-generated files:${violated}"
              echo
              echo "CHANGELOG.md and .release-please-manifest.json are auto-generated by"
              echo "release-please from conventional commits on main. Do not hand-edit them."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "conventional commit message (feat/fix/docs/...). release-please will"
              echo "update these files in the next release PR automatically."
            } >&2
            exit 1
          fi

          echo "No release-please-generated files modified. OK."
