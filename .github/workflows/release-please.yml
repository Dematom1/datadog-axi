name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current:
        description: Publish the current version if it is not already on npm
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Installing and building runs dependency code, so it happens here with a
  # read-only token and no OIDC access; publish only uploads the tarball.
  # Separate jobs also make a failed build or publish retryable with
  # "Re-run failed jobs", which reuses release-please's outputs.
  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created || inputs.publish_current) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # prepack rebuilds and checks the generated skill before packing.
      - run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: datadog-axi-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # npm trusted publishing: npm exchanges this OIDC token for a short-lived
      # publish credential and signs provenance, so no npm token is stored.
      id-token: write
    steps:
      - name: Validate manual publish ref
        if: ${{ inputs.publish_current }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*) ;;
            *) echo "Manual publishing is allowed only from main or a v* tag" >&2; exit 1 ;;
          esac

      # Node 24 bundles npm 11, which trusted publishing requires (>= 11.5.1).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Skip if version already exists
        id: version
        run: |
          version=$(tar -xOzf datadog-axi-*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if npm view "datadog-axi@$version" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.version.outputs.already_published != 'true' }}
        run: npm stage publish ./datadog-axi-*.tgz --access public --provenance
